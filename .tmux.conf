# One tmux session per account; the session name selects the account (see
# ~/.config/zsh/devctx.zsh). The status bar colour shows which one you're in.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"

set -g status-style "fg=colour255,bg=#{?#{==:#S,fungrim},colour25,#{?#{==:#S,personal},colour29,#{?#{==:#S,umbri},colour91,#{?#{==:#S,george},colour130,colour238}}}}"
set -g status-left-length 20
set -g status-left "#[bold,reverse] #S #[noreverse] "
set -g window-status-current-style "bold,reverse"
set -g status-right "%H:%M"
